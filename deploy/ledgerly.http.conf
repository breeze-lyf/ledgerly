# Stage 1 (HTTP only, for ACME). Replaced by ledgerly.conf after the cert is issued.
server {
    listen 80;
    listen [::]:80;
    server_name ledgerly.yufeng.fun;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
